id: data_load_gcs
namespace: spotify-tracks

variables:
  file: "dataset.csv"  # Nome do ficheiro CSV dentro do ZIP
  zip_file: "spotify-tracks-dataset.zip"  # Nome correto do ficheiro ZIP
  gcs_file: "gs://{{kv('GCP_BUCKET_NAME')}}/{{vars.file}}"  # Caminho no GCS
  local_file: "/tmp/{{vars.file}}"  # Caminho local temporário
  zip_local_file: "/tmp/{{vars.zip_file}}"  # Caminho local para o arquivo ZIP

tasks:
  - id: download_kaggle_data
    type: io.kestra.plugin.core.http.Download
    uri: "https://www.kaggle.com/datasets/maharshipandya/-spotify-tracks-dataset/download"

  - id: check_file_after_download
    type: io.kestra.plugin.core.log.Log
    message: "Verificando se o arquivo ZIP foi baixado corretamente em {{render(vars.zip_local_file)}}"

  - id: unzip
    type: io.kestra.plugin.compress.ArchiveDecompress
    algorithm: ZIP
    from: "{{render(vars.zip_local_file)}}"  # Usando o caminho do arquivo ZIP baixado

  - id: upload_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{render('/tmp/spotify-tracks-dataset/{{vars.file}}')}}"  # Caminho do arquivo CSV dentro do diretório descompactado
    to: "{{render(vars.gcs_file)}}"

  - id: log_gcs_upload
    type: io.kestra.plugin.core.log.Log
    message: "Ficheiro {{vars.file}} carregado para o GCS em {{vars.gcs_file}}"

  - id: process_dataset
    type: io.kestra.plugin.core.log.Log
    message: "Processando os dados no diretório /tmp/spotify-tracks-dataset"

  - id: purge_files
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
    description: Se quiseres explorar os outputs do Kestra, desativa esta task.
    disabled: false

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{kv('GCP_CREDS')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"
