version: 2

sources:
  - name: staging
    database: "{{ env_var('DBT_DATABASE', 'kestra-sandbox-450522') }}"
    schema: "{{ env_var('DBT_SCHEMA', 'trips_data_all') }}"
    tables:
      - name: fhv_tripdata

models:
    - name: stg_fhv_tripdata
      description: >
        Trip made by FHV taxis, also known for-hire vehicles.
        The records were collected and provided to the NYC Taxi and Limousine Commission (TLC) by
        technology service providers.
      columns:
          - name: dispatching_base_num
            description: dispatching_base_num
          - name: pickup_datetime
            description: The date and time when the meter was engaged.
          - name: dropOff_datetime
            description: The date and time when the meter was disengaged.
          - name: Affiliated_base_number
            description: Affiliated base number
          - name: PUlocationID
            description: locationid where the meter was engaged.
            tests:
              - relationships:
                  to: ref('taxi_zone_lookup')
                  field: locationid
                  severity: warn
          - name: DOlocationID
            description: locationid where the meter was engaged.
            tests:
              - relationships:
                  to: ref('taxi_zone_lookup')
                  field: locationid
          - name: SR_Flag
            description: SR Flag